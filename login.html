<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | ขวานคอนเสิร์ต Khwan Concert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="logo" href="index.html">
      <div class="logo-icon">🎸</div>
      <span class="logo-text">ขวานคอนเสิร์ต</span>
    </a>
    <div class="nav-links">
      <a class="nav-btn" href="index.html">หน้าหลัก</a>
      <a class="nav-btn" href="tickets.html">บัตรของฉัน</a>
      <a class="nav-btn" href="organizer.html">ผู้จัดงาน</a>
      <a class="nav-btn" href="gate.html">สแกนบัตร</a>
      <a class="nav-btn" id="authNavBtn" href="login.html">เข้าสู่ระบบ</a>
      <div class="user-badge hidden" id="userBadge">
        <span>👤</span>
        <span id="userName">ผู้ใช้</span>
      </div>
    </div>
  </nav>

  <!-- ========== AUTH ========== -->
  <div class="page active" id="page-auth">
    <div class="container">
      <div class="auth-container">
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="switchAuthTab('login')">เข้าสู่ระบบ</div>
          <div class="auth-tab" onclick="switchAuthTab('register')">สมัครสมาชิก</div>
        </div>
        <div class="card-box" id="loginForm">
          <div class="form-group">
            <label>อีเมล</label>
            <input type="email" id="loginEmail" placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" id="loginPass" placeholder="••••••••">
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">เข้าสู่ระบบ</button>
          <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">
            ทดลอง: กรอกอะไรก็ได้แล้วกดเข้าสู่ระบบ
          </p>
        </div>
        <div class="card-box hidden" id="registerForm">
          <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="regName" placeholder="ชื่อ นามสกุล">
          </div>
          <div class="form-group">
            <label>อีเมล</label>
            <input type="email" id="regEmail" placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" id="regPass" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>ยืนยันรหัสผ่าน</label>
            <input type="password" id="regPass2" placeholder="••••••••">
          </div>
          <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">สมัครสมาชิก</button>
        </div>
      </div>
    </div>
  </div>
  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <footer>
    © 2026 ขวานคอนเสิร์ต (Khwan Concert) · ระบบจองบัตรคอนเสิร์ต · โปรเจกต์กลุ่มขวาน
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
